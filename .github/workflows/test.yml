name: pure-python-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest
      - run: python scripts/preview_plan.py --output /tmp/g1_preview.npz
      - name: Enforce independent implementation boundary
        run: |
          ! grep -RInE 'bricksim|brickbench|rocobrick|waypoint_control|solve_ik_with_retries|bfs_sort_connections' src scripts tests
